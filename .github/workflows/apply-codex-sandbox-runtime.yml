name: Apply Codex Sandbox runtime

on:
  push:
    paths:
      - '.github/workflows/apply-codex-sandbox-runtime.yml'
      - '.github/scripts/apply_codex_sandbox_runtime.py'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply runtime patch
        run: python .github/scripts/apply_codex_sandbox_runtime.py
      - name: Commit runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Book Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: run Codex OAuth worker in persistent Vercel Sandbox"
          git push origin HEAD:main
