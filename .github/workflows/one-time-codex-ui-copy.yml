name: One-time Codex serverless UI copy

on:
  push:
    branches: [codex-serverless-fallback-20260829]
    paths:
      - .github/workflows/one-time-codex-ui-copy.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex-serverless-fallback-20260829
      - name: Update Codex copy and remove this workflow
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/books/new/book-wizard.tsx')
          text = p.read_text()
          replacements = {
            '${codexPlanType ?? "ChatGPT"} · Codex OAuth · Worker CODEX_HOME': '${codexPlanType ?? "ChatGPT"} · Codex OAuth · Vercel + Vault',
            '인증정보는 브라우저나 Supabase에 저장되지 않고 Codex Worker의 사용자별 CODEX_HOME에서 관리됩니다.': '인증정보는 브라우저에 저장하지 않고 Supabase Vault에 암호화 저장한 뒤, 생성 요청마다 Vercel의 임시 CODEX_HOME에 복원합니다.',
            'Codex OAuth가 사용자별 Worker CODEX_HOME에 연결되어 있습니다. ChatGPT/Codex 사용 한도를 사용합니다.': 'Codex OAuth가 Vercel 서버리스 런타임에 연결되어 있습니다. ChatGPT/Codex 사용 한도를 사용합니다.'
          }
          for old, new in replacements.items():
            if old in text:
              text = text.replace(old, new)
          p.write_text(text)
          PY
          git rm .github/workflows/one-time-codex-ui-copy.yml
      - name: Commit UI copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/books/new/book-wizard.tsx
          git diff --cached --check
          git commit -m "chore: align Codex UI with Vercel fallback"
          git push origin HEAD:codex-serverless-fallback-20260829
