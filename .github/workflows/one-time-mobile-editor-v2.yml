name: One-time mobile editor v2 patch

on:
  push:
    paths:
      - ".github/workflows/one-time-mobile-editor-v2.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: redesign/cohesive-mobile-v2
      - name: Patch manuscript-first mobile editor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          editor = Path('app/books/[id]/book-editor.tsx')
          s = editor.read_text()

          old = '  const [history,setHistory] = useState<Revision[]>([]);\n  const saveTimer = useRef<ReturnType<typeof setTimeout>|null>(null);'
          new = '  const [history,setHistory] = useState<Revision[]>([]);\n  const [mobilePanel,setMobilePanel] = useState<"outline"|"ai"|null>(null);\n  const saveTimer = useRef<ReturnType<typeof setTimeout>|null>(null);'
          if old not in s: raise SystemExit('state insertion point not found')
          s = s.replace(old, new, 1)

          old = '    setHistory([]);\n  }\n\n  function changeContent(value:string) {'
          new = '    setHistory([]);\n    setMobilePanel(null);\n  }\n\n  function changeContent(value:string) {'
          if old not in s: raise SystemExit('selectSection insertion point not found')
          s = s.replace(old, new, 1)

          old = '  return <div className="editor-shell">\n    <aside className="editor-sidebar">\n      <Link href="/dashboard" className="editor-brand"><span>AI BOOK</span><strong>STUDIO</strong></Link>'
          new = '''  return <div className="editor-shell manuscript-editor-shell">\n    <header className="editor-mobile-header">\n      <Link href="/dashboard" className="editor-mobile-back" aria-label="작업실로 돌아가기">←</Link>\n      <div className="editor-mobile-title"><span>{book.book_type}</span><strong>{selected?.title ?? book.title}</strong></div>\n      <button type="button" className="editor-mobile-action" aria-controls="book-ai-panel" aria-expanded={mobilePanel==="ai"} onClick={()=>setMobilePanel(mobilePanel==="ai"?null:"ai")}>AI</button>\n    </header>\n    {mobilePanel&&<button type="button" className="editor-mobile-scrim" aria-label="패널 닫기" onClick={()=>setMobilePanel(null)} />}\n\n    <aside id="book-outline-panel" className={`editor-sidebar ${mobilePanel==="outline"?"mobile-open":""}`}>\n      <div className="mobile-sheet-head"><strong>책 목차</strong><button type="button" onClick={()=>setMobilePanel(null)}>닫기</button></div>\n      <Link href="/dashboard" className="editor-brand"><span>AI BOOK</span><strong>STUDIO</strong></Link>'''
          if old not in s: raise SystemExit('editor root insertion point not found')
          s = s.replace(old, new, 1)

          old = '    <aside className="ai-panel">\n      <section className="ai-module generation-module">'
          new = '    <aside id="book-ai-panel" className={`ai-panel ${mobilePanel==="ai"?"mobile-open":""}`}>\n      <div className="mobile-sheet-head"><strong>AI · 출판 도구</strong><button type="button" onClick={()=>setMobilePanel(null)}>닫기</button></div>\n      <section className="ai-module generation-module">'
          if old not in s: raise SystemExit('AI panel insertion point not found')
          s = s.replace(old, new, 1)

          marker = '      {logs.length>0&&<section className="ai-module"><div className="module-heading"><h3>생성 로그</h3></div><div className="log">{logs.slice(0,12).map(log=><div key={log.id}>{new Date(log.created_at).toLocaleTimeString("ko-KR")} · {log.message}</div>)}</div></section>}\n    </aside>\n  </div>;'
          replacement = '''      {logs.length>0&&<section className="ai-module"><div className="module-heading"><h3>생성 로그</h3></div><div className="log">{logs.slice(0,12).map(log=><div key={log.id}>{new Date(log.created_at).toLocaleTimeString("ko-KR")} · {log.message}</div>)}</div></section>}\n    </aside>\n\n    <nav className="editor-mobile-dock" aria-label="원고 편집 도구">\n      <button type="button" aria-controls="book-outline-panel" aria-expanded={mobilePanel==="outline"} onClick={()=>setMobilePanel(mobilePanel==="outline"?null:"outline")}>목차</button>\n      <button type="button" className="current" aria-current="page">원고</button>\n      <button type="button" aria-controls="book-ai-panel" aria-expanded={mobilePanel==="ai"} onClick={()=>setMobilePanel(mobilePanel==="ai"?null:"ai")}>AI · 도구</button>\n    </nav>\n  </div>;'''
          if marker not in s: raise SystemExit('editor closing marker not found')
          s = s.replace(marker, replacement, 1)
          editor.write_text(s)

          shell = Path('app/books/[id]/book-editor-shell.tsx')
          t = shell.read_text()
          old = '  return <div className="editor-shell">\n    <aside className="editor-sidebar">'
          new = '  return <div className="editor-shell planning-editor-shell">\n    <aside className="editor-sidebar">'
          if old not in t: raise SystemExit('planning shell marker not found')
          t = t.replace(old, new, 1)
          shell.write_text(t)

          Path('.github/workflows/one-time-mobile-editor-v2.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/books/[id]/book-editor.tsx' 'app/books/[id]/book-editor-shell.tsx' .github/workflows/one-time-mobile-editor-v2.yml
          git commit -m "refactor: make mobile editor manuscript-first"
          git push origin HEAD:redesign/cohesive-mobile-v2
