name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm install --strict-allow-scripts
      - name: Audit production dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm audit --omit=dev --audit-level=high --fetch-timeout=60000 --fetch-retries=1; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "npm audit failed after 3 attempts"
              exit 1
            fi
            echo "npm registry audit endpoint failed; retrying in 5 seconds..."
            sleep 5
          done
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run worker:check
      - run: docker build -t ai-book-studio-codex-worker:ci services/codex-worker
      - run: npm run build
      - name: Package verified deployment source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: verified-production-source
          path: |
            .env.example
            app
            components
            lib
            services
            supabase
            types
            next.config.ts
            package.json
            postcss.config.mjs
            proxy.ts
            tsconfig.json
            vercel.json
          if-no-files-found: error
          retention-days: 3
