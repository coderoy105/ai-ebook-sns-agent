name: Trigger Codex Sandbox runtime

on:
  push:
    paths:
      - '.github/workflows/trigger-codex-sandbox-runtime.yml'

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch runtime patch
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run one-time-codex-sandbox-runtime.yml --repo "$GITHUB_REPOSITORY"
