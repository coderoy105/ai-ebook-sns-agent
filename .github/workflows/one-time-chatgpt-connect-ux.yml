name: One-time ChatGPT connect UX

on:
  push:
    paths:
      - '.github/workflows/one-time-chatgpt-connect-ux.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch ChatGPT connection UX
        run: python .github/scripts/patch-chatgpt-connect-ux.py
      - name: Commit UX changes
        run: |
          git config user.name "AI Book Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/books/new/book-wizard.tsx 'app/books/[id]/book-editor.tsx' app/books/new/codex-usage-status.tsx
          git commit -m "feat: simplify ChatGPT Plus connection UX"
          git push origin HEAD:main
