name: One-time fix Codex auth copy

on:
  push:
    paths:
      - '.github/workflows/one-time-fix-codex-auth-copy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python .github/scripts/fix-codex-auth-copy.py
      - name: Commit changes
        run: |
          git config user.name "AI Book Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/books/new/book-wizard.tsx 'app/books/[id]/book-editor.tsx'
          git commit -m "fix: clarify OpenAI Codex authorization screen"
          git push origin HEAD:main
