name: One-time isolate Codex Workflow runtime

on:
  push:
    paths:
      - '.github/workflows/one-time-isolate-codex-workflow.yml'
      - '.github/scripts/isolate_codex_workflow.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Apply Codex Workflow isolation
        run: python .github/scripts/isolate_codex_workflow.py
      - name: Commit runtime isolation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "AI Book Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "feat: isolate Codex Sandbox behind OIDC bridge"
          git push origin HEAD:main
