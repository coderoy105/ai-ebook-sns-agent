name: One-time isolate Codex Workflow runtime

on:
  push:
    paths:
      - '.github/workflows/one-time-isolate-codex-workflow.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Isolate Codex Sandbox behind OIDC bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          background = Path('lib/ai/background-provider.ts')
          background.write_text(r'''import { OpenRouterFreeProvider } from "@/lib/ai/openrouter-free";
import { createServiceSupabase } from "@/lib/supabase/server";
import { generateCodexBridgeStructured } from "@/lib/ai/codex-bridge-client";

export type BackgroundAiProvider = "openrouter" | "codex";

type StructuredArgs<T> = {
  schemaName: string;
  jsonSchema: Record<string, unknown>;
  system: string;
  prompt: string;
  parse: (value: unknown) => T;
  timeoutMs?: number;
};

type Usage = {
  inputTokens: number;
  outputTokens: number;
  durationMs: number;
  model: string;
  requestId?: string;
};

export function normalizeBackgroundProvider(value: unknown): BackgroundAiProvider {
  return value === "codex" ? "codex" : "openrouter";
}

export function backgroundProviderLabel(provider: BackgroundAiProvider) {
  return provider === "codex" ? "GPT-5.6 Luna · ChatGPT Plus" : "OpenRouter Free";
}

export function backgroundProviderCheckpointPrefix(provider: BackgroundAiProvider) {
  return provider === "codex" ? "CODEX_LUNA" : "FREE";
}

async function loadOpenRouterKey(userId: string) {
  const service = createServiceSupabase();
  const { data, error } = await service.rpc<string | null>("get_openrouter_credential", { p_user_id: userId });
  if (error) throw new Error(error.message);
  return typeof data === "string" && data.trim().length > 0 ? data : null;
}

export async function generateBackgroundStructured<T>(
  provider: BackgroundAiProvider,
  userId: string,
  args: StructuredArgs<T>
): Promise<{ value: T; usage: Usage }> {
  if (provider === "codex") return generateCodexBridgeStructured(userId, args);
  const key = await loadOpenRouterKey(userId);
  if (!key) throw new Error("FREE_AI_CONNECTION_REQUIRED");
  const client = new OpenRouterFreeProvider(key);
  return client.generateStructured({ model: "openrouter/free", ...args });
}
''')

          Path('lib/ai/codex-bridge-client.ts').write_text(r'''import { getVercelOidcToken } from "@vercel/oidc";

const CODEX_BRIDGE_PATH = "/api/core/internal/codex/generate";

type StructuredArgs<T> = {
  schemaName: string;
  jsonSchema: Record<string, unknown>;
  system: string;
  prompt: string;
  parse: (value: unknown) => T;
  timeoutMs?: number;
};

type BridgePayload = {
  value?: unknown;
  usage?: { inputTokens: number; outputTokens: number; durationMs: number; model: string; requestId?: string };
  error?: string;
};

function bridgeOrigin() {
  const hostname = process.env.VERCEL_URL?.trim() || process.env.VERCEL_PROJECT_PRODUCTION_URL?.trim();
  if (!hostname) throw new Error("CODEX_INTERNAL_BRIDGE_UNAVAILABLE");
  return hostname.startsWith("http://") || hostname.startsWith("https://") ? hostname.replace(/\/$/, "") : `https://${hostname}`;
}

export async function generateCodexBridgeStructured<T>(userId: string, args: StructuredArgs<T>) {
  const token = await getVercelOidcToken();
  if (!token) throw new Error("CODEX_INTERNAL_AUTH_UNAVAILABLE");

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), args.timeoutMs ?? 240000);
  try {
    const response = await fetch(`${bridgeOrigin()}${CODEX_BRIDGE_PATH}`, {
      method: "POST",
      headers: { authorization: `Bearer ${token}`, "content-type": "application/json" },
      body: JSON.stringify({
        userId,
        schemaName: args.schemaName,
        jsonSchema: args.jsonSchema,
        system: args.system,
        prompt: args.prompt,
        timeoutMs: args.timeoutMs
      }),
      cache: "no-store",
      signal: controller.signal
    });
    const payload = await response.json().catch(() => ({ error: `CODEX_INTERNAL_HTTP_${response.status}` })) as BridgePayload;
    if (!response.ok || payload.error || !payload.usage) throw new Error(payload.error ?? `CODEX_INTERNAL_HTTP_${response.status}`);
    return { value: args.parse(payload.value), usage: payload.usage };
  } catch (error) {
    if (error instanceof Error && error.name === "AbortError") throw new Error("CODEX_WORKER_TIMEOUT");
    throw error;
  } finally {
    clearTimeout(timeout);
  }
}
''')

          Path('lib/ai/provider-connection.ts').write_text(r'''import { createServiceSupabase } from "@/lib/supabase/server";
import { hasCodexWorkerConnection } from "@/lib/ai/codex-worker";
import type { BackgroundAiProvider } from "@/lib/ai/background-provider";

export async function hasBackgroundCredential(userId: string, provider: BackgroundAiProvider) {
  if (provider === "codex") return hasCodexWorkerConnection(userId);
  const service = createServiceSupabase();
  const { data, error } = await service.rpc<boolean>("has_openrouter_credential", { p_user_id: userId });
  if (error) throw new Error(error.message);
  return data === true;
}
''')

          internal = Path('lib/ai/codex-internal.ts')
          internal.write_text(r'''import { NextResponse } from "next/server";
import { z } from "zod";
import { verifyVercelOidcToken } from "@vercel/oidc";
import { generateCodexWorkerStructured } from "@/lib/ai/codex-worker";

const Schema = z.object({
  userId: z.string().uuid(),
  schemaName: z.string().min(1).max(120),
  jsonSchema: z.record(z.string(), z.unknown()),
  system: z.string().min(1).max(30000),
  prompt: z.string().min(1).max(120000),
  timeoutMs: z.number().int().min(10000).max(240000).optional()
});

async function assertProjectOidc(request: Request) {
  const authorization = request.headers.get("authorization") ?? "";
  const token = authorization.match(/^Bearer\s+(.+)$/i)?.[1]?.trim();
  if (!token) throw new Error("INTERNAL_UNAUTHORIZED");
  try {
    await verifyVercelOidcToken(token);
  } catch {
    throw new Error("INTERNAL_UNAUTHORIZED");
  }
}

export async function handleCodexGenerationBridge(request: Request) {
  try {
    await assertProjectOidc(request);
    const input = Schema.parse(await request.json());
    const result = await generateCodexWorkerStructured(input.userId, {
      schemaName: input.schemaName,
      jsonSchema: input.jsonSchema,
      system: input.system,
      prompt: input.prompt,
      timeoutMs: input.timeoutMs,
      parse: (value) => value
    });
    return NextResponse.json(result, { status: 200 });
  } catch (error) {
    const message = error instanceof Error ? error.message : "CODEX_INTERNAL_FAILED";
    const status = message === "INTERNAL_UNAUTHORIZED" ? 401 : message === "CODEX_USAGE_LIMIT" ? 429 : 400;
    return NextResponse.json({ error: message }, { status });
  }
}
''')

          editor = Path('lib/api/editor-handlers.ts')
          e = editor.read_text()
          e = e.replace('import { generateBackgroundStructured, hasBackgroundCredential, normalizeBackgroundProvider } from "@/lib/ai/background-provider";\n', 'import { generateBackgroundStructured, normalizeBackgroundProvider } from "@/lib/ai/background-provider";\nimport { hasBackgroundCredential } from "@/lib/ai/provider-connection";\n')
          editor.write_text(e)

          route = Path('app/api/core/[...path]/route.ts')
          r = route.read_text()
          r = r.replace('  backgroundProviderLabel,\n  hasBackgroundCredential,\n  normalizeBackgroundProvider\n} from "@/lib/ai/background-provider";', '  backgroundProviderLabel,\n  normalizeBackgroundProvider\n} from "@/lib/ai/background-provider";')
          r = r.replace('import { handleCodexGenerationBridge } from "@/lib/ai/codex-internal";\n', '')
          anchor = 'async function assertCodexReady(userId: string) {'
          helper = '''async function hasBackgroundCredential(userId: string, provider: "openrouter" | "codex") {\n  const module = await import("@/lib/ai/provider-connection");\n  return module.hasBackgroundCredential(userId, provider);\n}\n\n'''
          if helper not in r:
              r = r.replace(anchor, helper + anchor)
          r = r.replace('if (path[0] === "internal" && path[1] === "codex" && path[2] === "generate") return handleCodexGenerationBridge(request);', 'if (path[0] === "internal" && path[1] === "codex" && path[2] === "generate") {\n    const { handleCodexGenerationBridge } = await import("@/lib/ai/codex-internal");\n    return handleCodexGenerationBridge(request);\n  }')
          route.write_text(r)
          PY
          git config user.name "AI Book Studio Bot"
