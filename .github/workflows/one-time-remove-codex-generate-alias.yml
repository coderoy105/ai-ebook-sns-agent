name: One-time remove Codex generate alias

on:
  push:
    paths:
      - '.github/workflows/one-time-remove-codex-generate-alias.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove obsolete internal generate alias
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('app/api/core/[...path]/route.ts')
          s=p.read_text()
          block='''  if (bookId === "codex" && request.headers.get("authorization")?.startsWith("Bearer ")) {\n    const { handleCodexGenerationBridge } = await import("@/lib/ai/codex-internal");\n    return handleCodexGenerationBridge(request);\n  }\n\n'''
          if block not in s:
              raise SystemExit('obsolete alias not found')
          p.write_text(s.replace(block,''))
          PY
          git config user.name "AI Book Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/api/core/'[...path]'/route.ts
          git commit -m "refactor: remove obsolete Codex generate alias"
          git push origin HEAD:main
