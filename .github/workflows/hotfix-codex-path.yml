name: Hotfix Codex Vercel path

on:
  push:
    paths:
      - ".github/workflows/hotfix-codex-path.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Patch Turbopack-safe Codex CLI resolution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lib/ai/codex-serverless.ts')
          s = p.read_text()
          old_import = 'import { mkdtemp, mkdir, readFile, rm, writeFile } from "node:fs/promises";'
          new_import = 'import { access, mkdtemp, mkdir, readFile, rm, writeFile } from "node:fs/promises";'
          if old_import not in s:
              raise SystemExit('expected fs/promises import not found')
          s = s.replace(old_import, new_import, 1)
          old_fn = '''function codexEntry() {\n  const packageJson = require.resolve("@openai/codex/package.json");\n  return path.join(path.dirname(packageJson), "bin", "codex.js");\n}'''
          new_fn = '''async function codexEntry() {\n  const direct = path.join(process.cwd(), "node_modules", "@openai", "codex", "bin", "codex.js");\n  try {\n    await access(direct);\n    return direct;\n  } catch {\n    // Turbopack can rewrite a static require.resolve() to a numeric module id.\n    // Build the specifier dynamically so Node resolves the external package at runtime.\n    const packageSpecifier = ["@openai", "codex", "package.json"].join("/");\n    const packageJson = require.resolve(packageSpecifier);\n    if (typeof packageJson !== "string") throw new Error("CODEX_CLI_RESOLUTION_FAILED");\n    const fallback = path.join(path.dirname(packageJson), "bin", "codex.js");\n    await access(fallback);\n    return fallback;\n  }\n}'''
          if old_fn not in s:
              raise SystemExit('expected codexEntry block not found')
          s = s.replace(old_fn, new_fn, 1)
          old_spawn = '    const child = spawn(process.execPath, [codexEntry(), "app-server", "--listen", "stdio://"], {'
          new_spawn = '    const entry = await codexEntry();\n    const child = spawn(process.execPath, [entry, "app-server", "--listen", "stdio://"], {'
          if old_spawn not in s:
              raise SystemExit('expected spawn line not found')
          s = s.replace(old_spawn, new_spawn, 1)
          p.write_text(s)
          Path('.github/workflows/hotfix-codex-path.yml').unlink()
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ai/codex-serverless.ts .github/workflows/hotfix-codex-path.yml
          git commit -m "fix: resolve Codex CLI path safely on Vercel"
          git push origin HEAD:main
