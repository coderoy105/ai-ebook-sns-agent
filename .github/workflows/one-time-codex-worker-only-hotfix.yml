name: One-time Codex worker-only hotfix

on:
  push:
    paths:
      - '.github/workflows/one-time-codex-worker-only-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hotfix/codex-app-server-exited
          fetch-depth: 0
      - name: Restore worker-only Codex architecture
        shell: bash
        run: |
          set -euo pipefail
          GOOD=405a6101ab2d8c468d38d85623366b8197585c52
          git show "$GOOD:lib/ai/codex-worker.ts" > lib/ai/codex-worker.ts
          git show "$GOOD:lib/api/ai-connection-handlers.ts" > lib/api/ai-connection-handlers.ts
          git show "$GOOD:lib/ai/background-provider.ts" > lib/ai/background-provider.ts
          git show "$GOOD:lib/ai/codex-internal.ts" > lib/ai/codex-internal.ts
          rm -f lib/ai/codex-serverless.ts lib/api/codex-internal-handler.ts

          python - <<'PY'
          from pathlib import Path
          import json

          route = Path('app/api/core/[...path]/route.ts')
          s = route.read_text()
          s = s.replace('import { handleCodexInternalGenerate } from "@/lib/api/codex-internal-handler";', 'import { handleCodexGenerationBridge } from "@/lib/ai/codex-internal";')
          s = s.replace('return handleCodexInternalGenerate(request);', 'return handleCodexGenerationBridge(request);')
          route.write_text(s)

          package_path = Path('package.json')
          package = json.loads(package_path.read_text())
          package.get('scripts', {}).pop('codex:check', None)
          package.get('dependencies', {}).pop('@openai/codex', None)
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=2) + '\n')

          ci = Path('.github/workflows/ci.yml')
          ci_text = ci.read_text().replace('      - run: npm run codex:check\n', '')
          ci.write_text(ci_text)

          wizard = Path('app/books/new/book-wizard.tsx')
          w = wizard.read_text()
          w = w.replace('  aiProvider: "codex"\n};', '  aiProvider: "openrouter"\n};')
          w = w.replace('  const [codexConnected, setCodexConnected] = useState(false);', '  const [codexConnected, setCodexConnected] = useState(false);\n  const [codexWorkerAvailable, setCodexWorkerAvailable] = useState<boolean | null>(null);')
          w = w.replace('          setCodexConnected(status.connected === true);\n          setCodexPlanType(status.planType ?? null);', '          setCodexConnected(status.connected === true);\n          setCodexWorkerAvailable(status.workerConfigured !== false);\n          setCodexPlanType(status.planType ?? null);')
          w = w.replace('    setError("");\n    setCodexConnecting(true);', '    setError("");\n    if (codexWorkerAvailable === false) {\n      setError("ChatGPT Plus 연결 서버가 아직 준비되지 않았습니다. 현재는 OpenRouter Free를 사용해 주세요.");\n      return;\n    }\n    setCodexConnecting(true);', 1)
          w = w.replace('<small>{form.aiProvider === "codex" ? `${codexPlanType ?? "ChatGPT"} · Codex OAuth · Vercel + Vault` : "OpenRouter · 서버 Vault"}</small>', '<small>{form.aiProvider === "codex" ? (codexWorkerAvailable === false ? "Codex Worker 미연결 · 현재 선택 불가" : `${codexPlanType ?? "ChatGPT"} · Codex OAuth · Worker CODEX_HOME`) : "OpenRouter · 서버 Vault"}</small>')
          w = w.replace('disabled={loading || codexConnecting} onClick={connectCodex}>{codexConnecting ? "ChatGPT 로그인 대기 중…" : "ChatGPT Plus 연결"}', 'disabled={loading || codexConnecting || codexWorkerAvailable === false} onClick={connectCodex}>{codexWorkerAvailable === false ? "Codex Worker 준비 중" : codexConnecting ? "ChatGPT 로그인 대기 중…" : "ChatGPT Plus 연결"}')
          w = w.replace('<button className={`choice-tile ${form.aiProvider === "codex" ? "active" : ""}`} onClick={() => update("aiProvider", "codex")}>\n                  <strong>GPT-5.6 Luna · ChatGPT Plus</strong>\n                  <span>{codexConnected ? `${codexPlanType ?? "ChatGPT"} 연결됨` : "API 키 불필요 · Codex OAuth"}</span>\n                </button>', '<button disabled={codexWorkerAvailable === false} className={`choice-tile ${form.aiProvider === "codex" ? "active" : ""}`} onClick={() => update("aiProvider", "codex")}>\n                  <strong>GPT-5.6 Luna · ChatGPT Plus</strong>\n                  <span>{codexWorkerAvailable === false ? "Codex Worker 연결 후 사용 가능" : codexConnected ? `${codexPlanType ?? "ChatGPT"} 연결됨` : "API 키 불필요 · Codex OAuth"}</span>\n                </button>')
          w = w.replace('<p>버튼을 누르면 OpenAI의 Codex 기기 로그인 페이지가 새 탭으로 열립니다. 로그인 후 표시된 코드를 입력하면 인증정보는 브라우저에 저장하지 않고 Supabase Vault에 암호화 저장한 뒤, 생성 요청마다 Vercel의 임시 CODEX_HOME에 복원합니다.</p>', '<p>{codexWorkerAvailable === false ? "현재 지속 실행 Codex Worker가 연결되지 않아 ChatGPT Plus 로그인을 시작할 수 없습니다. OpenRouter Free는 바로 사용할 수 있습니다." : "버튼을 누르면 OpenAI의 Codex 기기 로그인 페이지가 새 탭으로 열립니다. 인증정보는 브라우저나 Supabase에 저장하지 않고 사용자별 Worker CODEX_HOME에서 관리합니다."}</p>')
          w = w.replace('disabled={codexConnecting} onClick={connectCodex}>{codexConnecting ? "로그인 완료를 기다리는 중…" : "ChatGPT Plus 연결"}', 'disabled={codexConnecting || codexWorkerAvailable === false} onClick={connectCodex}>{codexWorkerAvailable === false ? "Codex Worker 준비 중" : codexConnecting ? "로그인 완료를 기다리는 중…" : "ChatGPT Plus 연결"}')
          w = w.replace('"Codex OAuth가 Vercel 서버리스 런타임에 연결되어 있습니다. ChatGPT/Codex 사용 한도를 사용합니다."', '"Codex OAuth가 사용자별 Worker CODEX_HOME에 연결되어 있습니다. ChatGPT/Codex 사용 한도를 사용합니다."')
          wizard.write_text(w)
          PY

          npm install --package-lock-only --ignore-scripts

          git config user.name "AI Book Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "fix: remove unstable Vercel Codex app-server fallback"
          git push origin HEAD:hotfix/codex-app-server-exited
