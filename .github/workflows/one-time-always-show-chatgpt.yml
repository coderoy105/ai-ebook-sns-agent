name: One-time always show ChatGPT button

on:
  push:
    paths:
      - '.github/workflows/one-time-always-show-chatgpt.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch UI
        run: python .github/scripts/always-show-chatgpt-button.py
      - name: Commit changes
        run: |
          git config user.name "AI Book Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/books/new/book-wizard.tsx
          git commit -m "fix: always show ChatGPT connect button"
          git push origin HEAD:main
