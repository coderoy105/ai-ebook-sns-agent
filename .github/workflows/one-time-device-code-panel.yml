name: One-time device code panel

on:
  push:
    paths:
      - '.github/workflows/one-time-device-code-panel.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Apply device-code UX patch
        run: python .github/scripts/apply-device-code-panel.py
      - name: Commit changes
        run: |
          git config user.name "AI Book Studio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/books/new/book-wizard.tsx 'app/books/[id]/book-editor.tsx' app/globals.css
          git commit -m "feat: show ChatGPT device code before OpenAI auth"
          git push origin HEAD:main
