name: One-time production cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-time-production-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Fix Codex copy and lint warning
        run: |
          python - <<'PY'
          from pathlib import Path

          wizard = Path('app/books/new/book-wizard.tsx')
          text = wizard.read_text()
          replacements = {
              '${codexPlanType ?? "ChatGPT"} · Codex OAuth · 서버 Vault': '${codexPlanType ?? "ChatGPT"} · Codex OAuth · Worker CODEX_HOME',
              '로그인 후 표시된 코드를 입력하면 이 앱에는 API 키 대신 Codex OAuth 상태가 암호화 저장됩니다.': '로그인 후 표시된 코드를 입력하면 인증정보는 브라우저나 Supabase에 저장되지 않고 Codex Worker의 사용자별 CODEX_HOME에서 관리됩니다.',
              'Codex OAuth가 서버 Vault에 연결되어 있습니다. ChatGPT/Codex 사용 한도를 사용합니다.': 'Codex OAuth가 사용자별 Worker CODEX_HOME에 연결되어 있습니다. ChatGPT/Codex 사용 한도를 사용합니다.'
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'missing expected wizard text: {old}')
              text = text.replace(old, new)
          wizard.write_text(text)

          editor = Path('app/books/[id]/book-editor.tsx')
          text = editor.read_text()
          old = '''  async function saveNow(nextContent=content) {\n    if(!selected) return;\n    await saveSection(selected.id,nextContent);\n  }\n\n'''
          if old not in text:
              raise SystemExit('missing expected saveNow block')
          editor.write_text(text.replace(old, ''))
          PY
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/books/new/book-wizard.tsx 'app/books/[id]/book-editor.tsx'
          git diff --cached --check
          git commit -m "chore: align Codex OAuth copy and clear lint warning"
          git push origin HEAD:main
